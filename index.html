<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقعي</title>
<style>
:root{--bg:#f3f4f9;--card:#fff;--text:#1d1f2b;--muted:#6b7080;--p:#6c5ce7;--p2:#00b4d8;--bd:#e6e8f0;--ok:#1e9e6a;--no:#e5484d}
[data-theme=dark]{--bg:#12131a;--card:#1c1e29;--text:#e8e9f0;--muted:#9a9db0;--bd:#2c2f3d}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
header b{font-size:20px} header .r{display:flex;gap:8px;align-items:center;font-size:14px}
main{max-width:620px;margin:14px auto;padding:0 12px 40px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d;border:1px solid var(--bd)}
button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:15px;cursor:pointer;font-family:inherit}
button.g{background:#ffffff33;padding:6px 12px} button.ok{background:var(--ok)} button.no{background:var(--no)}
textarea,input[type=text]{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:12px;font-family:inherit;background:var(--bg);color:var(--text)}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--bd)}
nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
.top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.name{font-weight:bold} .time{color:var(--muted);font-size:12px}
.text{margin:10px 0;white-space:pre-wrap;line-height:1.6}
.pimg{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:4px}
.bar{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}
.act{background:var(--bg);color:var(--text);padding:7px 14px;border:1px solid var(--bd)} .act.on{color:var(--no);border-color:var(--no)}
.cbox{margin-top:10px} .cm{background:var(--bg);padding:8px 12px;border-radius:12px;margin-bottom:6px;font-size:14px}
.crow{display:flex;gap:8px} .crow input{flex:1}
.badge{font-size:12px;padding:3px 10px;border-radius:10px;color:#fff} .pending{background:#e0a100}.approved{background:var(--ok)}.rejected{background:var(--no)}
.hide{display:none} .rules{font-size:13px;color:var(--muted);margin:8px 0} .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#preview{max-width:100%;max-height:200px;border-radius:12px;margin-top:8px}
#status{color:var(--no)}
</style>
</head>
<body>
<header><b>موقعي ✨</b><div class="r"><span id="who"></span><button class="g" id="theme">🌙</button></div></header>
<main>
  <div id="status" class="card" style="display:none"></div>

  <div id="loginView" class="card" style="text-align:center">
    <h3>أهلًا بيك 👋</h3>
    <p>كل البوستات والتعليقات بتتراجع قبل ما تظهر، عشان الموقع يبقى آمن للكل.</p>
    <button id="loginBtn">سجّل دخول بجوجل</button>
  </div>

  <div id="nameView" class="card hide">
    <h3>اختار اسم العرض</h3>
    <p class="rules">ده الاسم اللي هيظهر للناس (مش لازم اسمك الحقيقي).</p>
    <input type="text" id="nameInput" maxlength="20" placeholder="مثلًا: نجم الصحرا">
    <p id="msg" style="color:var(--no)"></p>
    <button id="nameBtn">حفظ</button>
  </div>

  <div id="appView" class="hide">
    <nav>
      <button id="tHome" class="on">الرئيسية</button>
      <button id="tMine">بوستاتي</button>
      <button id="tAdmin" class="hide">المراجعة</button>
    </nav>
    <div id="homeView">
      <div class="card">
        <textarea id="postText" rows="3" maxlength="500" placeholder="اكتب بوست..."></textarea>
        <img id="preview" class="hide" alt="">
        <p class="rules">القواعد: ممنوع الشتايم والألفاظ الخارجة وأي محتوى غير لائق. كل بوست بيتراجع قبل ما يظهر.</p>
        <div class="tools">
          <button id="postBtn">نشر (للمراجعة)</button>
          <button id="imgBtn" class="act">📷 صورة</button>
          <button id="rmImg" class="act hide">إلغاء الصورة</button>
          <input type="file" id="imgFile" accept="image/*" class="hide">
          <span id="postMsg"></span>
        </div>
      </div>
      <div id="feed"></div>
    </div>
    <div id="mineView" class="hide"><div id="mine"></div></div>
    <div id="adminView" class="hide"><div id="queue"></div></div>
  </div>
</main>

<script>
  function showErr(m){var s=document.getElementById("status");s.style.display="block";s.textContent=m;}
  window.addEventListener("error",function(e){showErr("خطأ: "+e.message);});
  window.addEventListener("unhandledrejection",function(e){showErr("خطأ: "+(e.reason&&e.reason.message||e.reason));});
  setTimeout(function(){ if(!window.__loaded) showErr("الموقع مش قادر يحمّل Firebase. تأكد إنك فاتح الرابط من النت وإن النت شغال."); },5000);
</script>
<script type="module">
window.__loaded = true;
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbM5PTvjYT5s4m3r9Vezue8a3H1Rd8ERk",
  authDomain: "my-social-app-94baa.firebaseapp.com",
  projectId: "my-social-app-94baa",
  storageBucket: "my-social-app-94baa.firebasestorage.app",
  messagingSenderId: "1046859842661",
  appId: "1:1046859842661:web:2519eaf2363d66d6f2328c"
};
const ADMIN_EMAIL = "hythmasamh56@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
let me = null, myName = "", isAdmin = false, imgData = "";

// الدارك مود
const setTheme = t => { document.documentElement.dataset.theme = t; $("theme").textContent = t === "dark" ? "☀️" : "🌙"; try { localStorage.setItem("theme", t); } catch (e) {} };
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

const show = id => ["loginView", "nameView", "appView"].forEach(v => $(v).classList.toggle("hide", v !== id));
const tab = t => {
  ["home", "mine", "admin"].forEach(n => {
    $(n + "View").classList.toggle("hide", n !== t);
    $("t" + n[0].toUpperCase() + n.slice(1)).classList.toggle("on", n === t);
  });
  if (t === "home") loadFeed(); if (t === "mine") loadMine(); if (t === "admin") loadQueue();
};
$("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("مشكلة في الدخول: " + e.code));
$("tHome").onclick = () => tab("home"); $("tMine").onclick = () => tab("mine"); $("tAdmin").onclick = () => tab("admin");

onAuthStateChanged(auth, async user => {
  me = user;
  if (!user) { $("who").replaceChildren(); show("loginView"); return; }
  isAdmin = user.email === ADMIN_EMAIL;
  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) { show("nameView"); return; }
  myName = snap.data().name; start();
});
$("nameBtn").onclick = async () => {
  const n = $("nameInput").value.trim();
  if (n.length < 2) { $("msg").textContent = "الاسم قصير"; return; }
  await setDoc(doc(db, "users", me.uid), { name: n }); myName = n; start();
};
function start() {
  const b = el("button", "g", "خروج"); b.onclick = () => signOut(auth);
  $("who").replaceChildren(myName + " ", b);
  $("tAdmin").classList.toggle("hide", !isAdmin);
  show("appView"); tab("home");
}

// الصور: نصغّرها قبل الحفظ
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const out = (w, q) => { const s = Math.min(1, w / im.width); const c = document.createElement("canvas"); c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
        let d = out(800, 0.7); if (d.length > 600000) d = out(600, 0.5);
        d.length > 700000 ? rej(new Error("الصورة كبيرة")) : res(d);
      };
      im.onerror = () => rej(new Error("الصورة مش مناسبة")); im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$("imgBtn").onclick = () => $("imgFile").click();
$("imgFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { imgData = await shrink(f); $("preview").src = imgData; $("preview").classList.remove("hide"); $("rmImg").classList.remove("hide"); }
  catch (err) { showErr(err.message); }
};
$("rmImg").onclick = () => { imgData = ""; $("imgFile").value = ""; $("preview").classList.add("hide"); $("rmImg").classList.add("hide"); };

$("postBtn").onclick = async () => {
  const text = $("postText").value.trim();
  if (!text && !imgData) return;
  const data = { text, uid: me.uid, authorName: myName, status: "pending", createdAt: serverTimestamp() };
  if (imgData) data.image = imgData;
  await addDoc(collection(db, "posts"), data);
  $("postText").value = ""; $("rmImg").click();
  $("postMsg").textContent = "✅ بوستك في انتظار المراجعة";
  setTimeout(() => $("postMsg").textContent = "", 4000);
};

const when = p => p.createdAt ? p.createdAt.toDate().toLocaleString("ar-EG") : "";
const sortNew = a => a.sort((x, y) => (y.createdAt?.seconds || 0) - (x.createdAt?.seconds || 0));
const label = { pending: "في الانتظار", approved: "اتقبل", rejected: "اترفض" };
async function getList(q) { const s = await getDocs(q); return sortNew(s.docs.map(d => ({ id: d.id, ...d.data() }))); }
const empty = t => el("p", "time", t);

function postCard(p) {
  const d = el("div", "card"), top = el("div", "top"), meta = el("div");
  meta.append(el("div", "name", p.authorName), el("div", "time", when(p)));
  top.append(el("div", "av", (p.authorName || "?")[0]), meta); d.append(top);
  if (p.text) d.append(el("div", "text", p.text));
  if (p.image && p.image.startsWith("data:image/")) { const i = el("img", "pimg"); i.src = p.image; d.append(i); }
  return d;
}

function addActions(d, p) {
  const bar = el("div", "bar"), lk = el("button", "act", "🤍 0"), cm = el("button", "act", "💬 تعليق");
  bar.append(lk, cm);
  if (isAdmin) { const del = el("button", "act", "🗑"); del.onclick = async () => { if (confirm("حذف البوست؟")) { await deleteDoc(doc(db, "posts", p.id)); loadFeed(); } }; bar.append(del); }
  const box = el("div", "cbox hide"); d.append(bar, box);
  let liked = false, count = 0;
  const paint = () => { lk.textContent = (liked ? "❤️ " : "🤍 ") + count; lk.classList.toggle("on", liked); };
  getDocs(query(collection(db, "likes"), where("postId", "==", p.id))).then(s => { count = s.size; liked = s.docs.some(x => x.data().uid === me.uid); paint(); }).catch(() => {});
  lk.onclick = async () => {
    const ref = doc(db, "likes", p.id + "_" + me.uid);
    try { if (liked) { await deleteDoc(ref); liked = false; count--; } else { await setDoc(ref, { postId: p.id, uid: me.uid }); liked = true; count++; } paint(); }
    catch (e) { showErr("مشكلة في اللايك"); }
  };
  cm.onclick = () => { box.classList.toggle("hide"); if (!box.classList.contains("hide")) loadComments(p, box); };
}

async function loadComments(p, box) {
  box.replaceChildren(empty("جاري التحميل..."));
  const list = (await getList(query(collection(db, "comments"), where("postId", "==", p.id), where("status", "==", "approved")))).reverse();
  const items = list.map(c => { const r = el("div", "cm"); r.append(el("b", "", c.authorName + ": "), document.createTextNode(c.text)); return r; });
  const inp = el("input"); inp.type = "text"; inp.maxLength = 300; inp.placeholder = "اكتب تعليق...";
  const send = el("button", "", "إرسال"), msg = el("div", "time"), row = el("div", "crow"); row.append(inp, send);
  send.onclick = async () => {
    const t = inp.value.trim(); if (!t) return;
    await addDoc(collection(db, "comments"), { postId: p.id, postSnippet: (p.text || "[صورة]").slice(0, 40), text: t, uid: me.uid, authorName: myName, status: "pending", createdAt: serverTimestamp() });
    inp.value = ""; msg.textContent = "✅ تعليقك في انتظار المراجعة";
  };
  box.replaceChildren(...items, row, msg);
}

async function loadFeed() {
  const list = await getList(query(collection(db, "posts"), where("status", "==", "approved")));
  $("feed").replaceChildren(...(list.length ? list.map(p => { const c = postCard(p); addActions(c, p); return c; }) : [empty("مفيش بوستات لسه.")]));
}
async function loadMine() {
  const list = await getList(query(collection(db, "posts"), where("uid", "==", me.uid)));
  $("mine").replaceChildren(...(list.length ? list.map(p => { const c = postCard(p); c.append(el("span", "badge " + p.status, label[p.status])); return c; }) : [empty("لسه ماكتبتش بوستات.")]));
}
async function loadQueue() {
  const ps = await getList(query(collection(db, "posts"), where("status", "==", "pending")));
  const cs = await getList(query(collection(db, "comments"), where("status", "==", "pending")));
  $("tAdmin").textContent = "المراجعة (" + (ps.length + cs.length) + ")";
  const review = (col, item, card) => {
    const ok = el("button", "ok", "✅ وافق"), no = el("button", "no", "❌ ارفض"), row = el("div", "bar");
    ok.onclick = async () => { await updateDoc(doc(db, col, item.id), { status: "approved" }); loadQueue(); };
    no.onclick = async () => { await updateDoc(doc(db, col, item.id), { status: "rejected" }); loadQueue(); };
    row.append(ok, no); card.append(row); return card;
  };
  const cards = [...ps.map(p => review("posts", p, postCard(p))),
    ...cs.map(c => { const d = el("div", "card"); d.append(el("div", "name", "💬 تعليق من " + c.authorName), el("div", "time", "على: " + c.postSnippet), el("div", "text", c.text)); return review("comments", c, d); })];
  $("queue").replaceChildren(...(cards.length ? cards : [empty("مفيش حاجة منتظرة ✨")]));
}
</script>
</body>
</html>
